<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">P0-C 长视频切片与本地自动成片流程图</title>
  <desc id="desc">从项目需求和素材输入，经过 G0 到 G5 六个节点，最终完成内部交付。蓝色为默认自动处理，橙色为用户确认，虚线为定向返工。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C2E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#60A5FA"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#FBBF24"/></marker>
    <marker id="arrowSlate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#94A3B8"/></marker>
    <style>
      .title { font-family: 'Microsoft YaHei', Arial, sans-serif; font-size: 42px; font-weight: 700; fill: #F8FAFC; }
      .subtitle { font-family: 'Microsoft YaHei', Arial, sans-serif; font-size: 20px; fill: #A8B7CC; }
      .node-title { font-family: 'Microsoft YaHei', Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #F8FAFC; }
      .node-body { font-family: 'Microsoft YaHei', Arial, sans-serif; font-size: 18px; fill: #C7D6E8; }
      .gate { font-family: 'Microsoft YaHei', Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #1F2937; }
      .hint { font-family: 'Microsoft YaHei', Arial, sans-serif; font-size: 15px; fill: #C7D6E8; }
      .legend { font-family: 'Microsoft YaHei', Arial, sans-serif; font-size: 16px; fill: #C7D6E8; }
      .small { font-family: 'Microsoft YaHei', Arial, sans-serif; font-size: 14px; fill: #9FB1C8; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="110" y="92" class="title">P0-C：从长视频素材到可验收成片</text>
  <text x="110" y="132" class="subtitle">默认自动完成生产与校验；只在内容、授权和交付边界处请求用户确认</text>

  <!-- Start -->
  <g filter="url(#shadow)">
    <rect x="92" y="225" width="200" height="112" rx="18" fill="#1F334E" stroke="#5FA8FF" stroke-width="2"/>
    <text x="192" y="268" text-anchor="middle" class="node-title">项目输入</text>
    <text x="192" y="300" text-anchor="middle" class="node-body">需求 · 本地素材</text>
  </g>

  <!-- Top row nodes -->
  <g filter="url(#shadow)">
    <rect x="385" y="190" width="285" height="182" rx="18" fill="#17365D" stroke="#60A5FA" stroke-width="2"/>
    <text x="420" y="235" class="node-title">G0 素材包</text>
    <text x="420" y="270" class="node-body">需求、素材、授权、BGM</text>
    <text x="420" y="300" class="node-body">统一登记与身份校验</text>
    <text x="420" y="335" class="small">不改原始文件</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="815" y="190" width="285" height="182" rx="18" fill="#17365D" stroke="#60A5FA" stroke-width="2"/>
    <text x="850" y="235" class="node-title">G1 创作方向</text>
    <text x="850" y="270" class="node-body">主题、受众、叙事角度</text>
    <text x="850" y="300" class="node-body">风格与表达边界</text>
    <text x="850" y="335" class="small">参考只分析，不挪用</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1245" y="190" width="285" height="182" rx="18" fill="#17365D" stroke="#60A5FA" stroke-width="2"/>
    <text x="1280" y="235" class="node-title">G2 证据与口播</text>
    <text x="1280" y="270" class="node-body">转写、证据、口播、配音</text>
    <text x="1280" y="300" class="node-body">字幕时间轴与事实边界</text>
    <text x="1280" y="335" class="small">已有分析可复用</text>
  </g>

  <!-- Bottom row nodes -->
  <g filter="url(#shadow)">
    <rect x="385" y="610" width="285" height="182" rx="18" fill="#17365D" stroke="#60A5FA" stroke-width="2"/>
    <text x="420" y="655" class="node-title">G3 剪辑计划</text>
    <text x="420" y="690" class="node-body">语义拆解、抽帧观察</text>
    <text x="420" y="720" class="node-body">选镜验证、时间线、转场</text>
    <text x="420" y="755" class="small">画面必须支撑口播</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="815" y="610" width="285" height="182" rx="18" fill="#17365D" stroke="#60A5FA" stroke-width="2"/>
    <text x="850" y="655" class="node-title">G4 剪辑与渲染</text>
    <text x="850" y="690" class="node-body">分段裁切、原声排除</text>
    <text x="850" y="720" class="node-body">口播、BGM、字幕、预览</text>
    <text x="850" y="755" class="small">可选 ChatCut 微调</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1245" y="610" width="285" height="182" rx="18" fill="#17365D" stroke="#60A5FA" stroke-width="2"/>
    <text x="1280" y="655" class="node-title">G5 质检与交付</text>
    <text x="1280" y="690" class="node-body">解码、规格、哈希、追溯</text>
    <text x="1280" y="720" class="node-body">交付包与人工验收</text>
    <text x="1280" y="755" class="small">警告不隐藏，明确留档</text>
  </g>

  <!-- Final -->
  <g filter="url(#shadow)">
    <rect x="1635" y="645" width="190" height="112" rx="56" fill="#166534" stroke="#4ADE80" stroke-width="2"/>
    <text x="1730" y="688" text-anchor="middle" class="node-title">内部交付</text>
    <text x="1730" y="720" text-anchor="middle" class="node-body">可验收、可追溯</text>
  </g>

  <!-- Main arrows -->
  <path d="M292 281 H385" stroke="#60A5FA" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M670 281 H815" stroke="#60A5FA" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M1100 281 H1245" stroke="#60A5FA" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M1387 372 V490 H527 V610" stroke="#60A5FA" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M670 701 H815" stroke="#60A5FA" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M1100 701 H1245" stroke="#60A5FA" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M1530 701 H1635" stroke="#60A5FA" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- Human gates -->
  <g>
    <rect x="690" y="248" width="104" height="66" rx="14" fill="#FCD34D"/>
    <text x="742" y="274" text-anchor="middle" class="gate">确认资料</text>
    <text x="742" y="296" text-anchor="middle" class="gate">与授权</text>
  </g>
  <g>
    <rect x="1120" y="248" width="104" height="66" rx="14" fill="#FCD34D"/>
    <text x="1172" y="274" text-anchor="middle" class="gate">确认方向</text>
    <text x="1172" y="296" text-anchor="middle" class="gate">与边界</text>
  </g>
  <g>
    <rect x="1260" y="450" width="254" height="62" rx="14" fill="#FCD34D"/>
    <text x="1387" y="477" text-anchor="middle" class="gate">确认事实、口播、声音</text>
    <text x="1387" y="498" text-anchor="middle" class="gate">以及完整剪辑回显</text>
  </g>
  <g>
    <rect x="690" y="668" width="104" height="66" rx="14" fill="#FCD34D"/>
    <text x="742" y="694" text-anchor="middle" class="gate">确认候选</text>
    <text x="742" y="716" text-anchor="middle" class="gate">成片</text>
  </g>
  <g>
    <rect x="1120" y="668" width="104" height="66" rx="14" fill="#FCD34D"/>
    <text x="1172" y="694" text-anchor="middle" class="gate">最终播放</text>
    <text x="1172" y="716" text-anchor="middle" class="gate">与交付确认</text>
  </g>

  <!-- Rework loops -->
  <path d="M527 610 V535 H1387 V372" stroke="#94A3B8" stroke-width="3" stroke-dasharray="9 9" fill="none" marker-end="url(#arrowSlate)"/>
  <text x="918" y="524" text-anchor="middle" class="hint">发现口播与画面不匹配，定向回到 G3</text>
  <path d="M958 610 V565 H527 V610" stroke="#94A3B8" stroke-width="3" stroke-dasharray="9 9" fill="none" marker-end="url(#arrowSlate)"/>
  <text x="742" y="592" text-anchor="middle" class="hint">G4 微调</text>
  <path d="M1387 610 V560 H958 V610" stroke="#94A3B8" stroke-width="3" stroke-dasharray="9 9" fill="none" marker-end="url(#arrowSlate)"/>
  <text x="1172" y="592" text-anchor="middle" class="hint">G5 发现问题，回到 G4</text>

  <!-- Legend -->
  <line x1="110" y1="930" x2="175" y2="930" stroke="#60A5FA" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="195" y="936" class="legend">默认自动生产流程</text>
  <rect x="470" y="906" width="112" height="48" rx="12" fill="#FCD34D"/>
  <text x="526" y="936" text-anchor="middle" class="gate">人工确认点</text>
  <line x1="690" y1="930" x2="755" y2="930" stroke="#94A3B8" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#arrowSlate)"/>
  <text x="785" y="936" class="legend">问题定向返工，不推倒全流程</text>
  <text x="110" y="1000" class="small">P0-C 的关键不是一次生成成片，而是让每一次内容决策、素材身份和验收结果都可验证、可回退、可交接。</text>
</svg>
